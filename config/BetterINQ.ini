; 测试用配置（tests/ 里的面板和配置测试读它）：一套「米拉」全套 + 一份猫饭
; 改完存盘，下次进游戏生效。

[General]
QuestID=66845        ; 重开时接的任务 ID，0 = 用上一次的任务
Reset=0              ; 1 = 重置后回据点再接（慢，完全走正规流程）
AcceptOnly=0         ; 1 = 只接任务，不出发
WyvernStart=0        ; 1 = 普通地图用翼龙起始
ActiveSet=1          ; 重开时套用的全套编号（下面 [Set.编号] 的数字），-1 = 不套
Food=1               ; 每次进任务都吃的猫饭（下面 [Food.编号]），-1 = 不管
QuickBlackout=1      ; 缩短转场黑屏

[Hotkeys]
; 手柄：A B X Y LB RB LT RT LS RS Up Down Left Right View Menu
; 键盘：Ctrl Shift Alt F1~F12 A~Z 0~9 Insert Delete Home End PageUp PageDown
; 多个组合用 | 隔开
Restart=LB+RB+LT+RT
ResetOnly=
Panel=Insert

; 全套：Equip 写装备套装编号（游戏里第几套），Item 写道具套装的存放格 "#编号"
[Set.1]
Name=米拉
Equip=7
Item=#3
LinkRadial=1         ; 套道具时联动快捷栏
Food=1
Quest=66845

; 猫饭：HP 0~5  Stamina 0~2  Attack/Defense/ElemRes 0~3  Skill -1~56
; 技能是 IN-Q 里那三个（32 猫的大毅力、9 猫的防御术【大】、39 猫的短期催眠术）；
; 能力那几项 IN-Q 的写法对不上，先按 体力+50 / 耐力+50 / 攻击大，进游戏看一眼对不对
[Food.1]
HP=5
Stamina=2
Attack=3
Defense=0
ElemRes=0
Skills=32,9,39
